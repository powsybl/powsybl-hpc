name: CI on forks - build and tests

on:
  pull_request:

permissions: {}

jobs:
  build:
    name: Build OS ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    if: github.event.pull_request.head.repo.fork == true
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Setup [JDK, Maven build, Sonar]
        uses: powsybl/github-ci/powsybl-fork-build@92ecf9095bf06895108c08e739913ac6da4bebcf #main
        with:
          distribution_module: 'distribution-hpc'

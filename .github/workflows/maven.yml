name: CI

on:
  push:
    branches:
      - 'test/ci_action_mvn_check'

permissions: { }

jobs:
  build:
    name: Build OS ${{ matrix.os }}
    if: github.event.pull_request.head.repo.fork == false
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Setup [JDK, Maven build, Sonar]
        uses: powsybl/github-ci/powsybl-dev@0fd98fb981bfe13f572dba7980bdca683b5e6d5f # v1.0.0 - next
        with:
          sonar_token: ${{ secrets.SONAR_TOKEN }}
          sonar_projectKey: 'com.powsybl:powsybl-hpc'
